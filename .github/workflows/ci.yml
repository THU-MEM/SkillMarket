name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test cloud skill without credentials or network calls
        run: |
          python -m pip install -r examples/tsinghua-cloud-drive/requirements.txt
          python -B -m unittest discover -s tests/cloud-drive -v

      - name: Validate registry
        run: npm run validate:registry

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

  installer-windows:
    name: Windows skill installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test dependency-free installer
        run: node --test tests/install-skill.test.mjs tests/cloud-skill.test.mjs
